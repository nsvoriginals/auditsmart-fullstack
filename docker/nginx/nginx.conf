user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;

events { worker_connections 512; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout 65;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=webhook:10m rate=60r/m;

  # Upstream: Next.js API
  upstream nextjs {
    server api:3000;
    keepalive 8;
  }

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY    always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # Hide Nginx version
    server_tokens off;

    # Main API proxy
    location / {
      limit_req zone=api burst=20 nodelay;

      proxy_pass         http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;

      # Limit upload size (1 MB — matches app middleware)
      client_max_body_size 1m;
    }

    # Webhook endpoint gets a looser rate limit
    location /api/payment/razorpay/webhook {
      limit_req zone=webhook burst=10 nodelay;
      proxy_pass       http://nextjs;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Worker metrics endpoint — internal only
    location /metrics {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      deny  all;
      proxy_pass http://worker:9090;
    }
  }
}
