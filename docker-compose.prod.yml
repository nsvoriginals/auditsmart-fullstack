# docker-compose.prod.yml — production overrides for AWS EC2 t2.micro
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
version: '3.9'

services:
  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No port exposure — accessed only via internal network
    ports: []
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?err}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports: []
    deploy:
      resources:
        limits:
          memory: 288M

  api:
    restart: always
    image: ${API_IMAGE:-ghcr.io/nsvoriginals/auditsmart-api:latest}
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runner
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?err}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?err}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?err}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?err}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: ${REDIS_URL:?err}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?err}
    ports: []  # nginx handles external traffic
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  worker:
    restart: always
    image: ${WORKER_IMAGE:-ghcr.io/nsvoriginals/auditsmart-worker:latest}
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_WORKER_URL:-${DATABASE_URL:?err}}
      REDIS_URL: ${REDIS_URL:?err}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?err}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_PORT: "9090"
      NODE_OPTIONS: "--max-old-space-size=384"
    ports: []
    deploy:
      resources:
        limits:
          memory: 448M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    restart: always
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  pgdata:
    driver: local
