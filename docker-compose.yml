# docker-compose.yml — local development
# Production: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

networks:
  internal:
    driver: bridge
  # Analysis workers: isolated, NO outbound internet
  analysis:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:

services:
  # ── PostgreSQL + pgvector ────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-auditsmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-auditsmart}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditsmart}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c max_connections=50
        -c wal_buffers=8MB
        -c log_min_duration_statement=2000

  # ── Redis (BullMQ + caching) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [internal]
    command: >
      redis-server
        --save 60 1
        --loglevel warning
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js API ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runner
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [internal]

  # ── Slither Analysis Sidecar ──────────────────────────────────────────
  slither:
    build:
      context: services/slither
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SLITHER_TIMEOUT: "120"
    # Internal only — never exposed publicly
    networks: [analysis]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── BullMQ Worker ─────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      METRICS_PORT:          "9090"
      NODE_OPTIONS:          "--max-old-space-size=384"
      SLITHER_SERVICE_URL:   "http://slither:8001"
      SLITHER_TIMEOUT_MS:    "130000"
      SEMGREP_TIMEOUT_MS:    "60000"
    ports:
      - "9090:9090"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      slither:  { condition: service_healthy }
    networks: [internal, analysis]
